name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with g++
        run: make

      - name: Run unit tests
        run: make test

      - name: Run latency benchmark
        run: make bench

  python-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server deps
        working-directory: server
        run: |
          pip install -r requirements.txt
          python -m compileall main.py

      - name: Smoke test (imports + app boots)
        working-directory: server
        run: python -c "from main import app; assert app is not None; print('server imports OK')"
