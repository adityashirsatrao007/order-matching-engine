name: Bug report
description: Report a bug so it can be fixed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. Call `...`
        3. See error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS / Python / Node version, any relevant config.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
