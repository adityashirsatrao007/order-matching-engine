services:
  - type: web
    name: order-matching-engine
    region: oregon
    plan: free
    env: docker
    repo: https://github.com/adityashirsatrao007/order-matching-engine
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /docs
    autoDeploy: true
    # FastAPI + WebSocket bridge. Render web services support WebSocket out of the box
    # (wss://<svc>.onrender.com/ws). Port 8000 matches EXPOSE in Dockerfile.
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: data
      mountPath: /data
      sizeGB: 0
